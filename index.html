        "<h4>企業価値の内訳</h4>資金 ＋ 知名度×30 ＋ 技術力×20 ＋ 社員×50 ＋ 製品品質の合計×5 ＋ 子会社収入×15 ＋ 海外拠点×8000万。<br>→ <b>知名度・技術力・社員・海外</b>がよく効きます。" +
        "<h4>争奪戦の勝率</h4>勝率 ＝ 自社戦力 ÷（自社戦力＋敵戦力）（下限5%〜上限95%、勲章で＋補正）。<br>自社戦力 ＝ 知名度 ＋ 技術力 ＋ 製品品質計÷2 ＋ 社員×2 ＋ 海外拠点×30。<br>→ 不利なら<b>引き抜き工作</b>で敵戦力を削るのが有効。" +
        "<h4>士気のティア（売上補正）</h4>90+ 絶好調 +12% ／ 70+ 好調 +6% ／ 50+ 良好 ±0 ／ 30+ 停滞 -8% ／ 15+ 疲弊 -20% ／ 15未満 崩壊 -38%＋行動-1。" +
        "<h4>知名度のティア</h4>会社規模が大きいほどペナルティが重くなります（創業期は緩く、大企業ほど厳しい）。<b>広告</b>でこまめに上げましょう。" +
        "<h4>序盤の進め方</h4>① 新製品開発で売り物を作る → ② 広告で知名度UP → ③ 月次決算を承認。<br>黒字なら手元資金が減っても問題なし。技術研修は中盤以降に品質を伸ばしたい時に。" +
        '<button class="enh-close">閉じる</button>' +
        "</div>";
      ov.addEventListener("click", function (e) {
        if (e.target === ov || (e.target.classList && e.target.classList.contains("enh-close"))) ov.remove();
      });
      document.body.appendChild(ov);
    }

    var hb = document.createElement("button");
    hb.className = "enh-help-btn";
    hb.textContent = "📊";
    hb.title = "数値ヘルプ";
    hb.addEventListener("click", openHelp);

    /* ---------- #2a 初手ガイド（1回だけ） ---------- */
    function maybeTip() {
      if (getF("enh_tip_v1")) return;
      if (document.querySelector(".enh-tip")) return;
      var txt = (document.body.innerText || "");
      if (txt.indexOf("残り行動") < 0) return; // 経営画面でのみ表示
      if (txt.indexOf("秘書のご案内") >= 0) return; // チュートリアル中は出さない（重複・重なり防止）
      var tip = document.createElement("div");
      tip.className = "enh-tip";
      tip.innerHTML =
        "💡 <b>初手ガイド</b>：迷ったら <b>①新製品開発 → ②広告 → ③月次決算を承認</b> の順でOK！黒字なら手元資金が減っても大丈夫。" +
        "<br><button>わかった</button>";
      tip.querySelector("button").addEventListener("click", function () {
        tip.remove();
        setF("enh_tip_v1", "1");
      });
      document.body.appendChild(tip);
    }

    /* ---------- #3b 争奪戦の勝率“目安”を表示 ---------- */
    var WIN = new RegExp("敵\\s*(\\d+)\\s*/\\s*自社\\s*(\\d+)");
    function augment() {
      // ヘルプボタンが消えていたら付け直す
      if (!document.body.contains(hb)) {
        try { document.body.appendChild(hb); } catch (e) {}
      }
      // 「敵A/自社B」を含む要素を集め、最内（子孫に同パターンを含まない）要素だけに付ける
      var nodes = document.querySelectorAll("span,div,p");
      var cands = [];
      for (var i = 0; i < nodes.length; i++) {
        if (WIN.test(nodes[i].textContent || "")) cands.push(nodes[i]);
      }
      for (var j = 0; j < cands.length; j++) {
        var el = cands[j];
        if (el.querySelector && el.querySelector(".enh-rate")) continue;
        // 子孫にも一致要素があるなら、より内側に任せてスキップ（二重表示防止）
        var inner = false;
        for (var k = 0; k < cands.length; k++) {
          if (cands[k] !== el && el.contains(cands[k])) { inner = true; break; }
        }
        if (inner) continue;
        var m = (el.textContent || "").match(WIN);
        var en = +m[1], own = +m[2];
        if (!(own + en > 0)) continue;
        var r = Math.max(5, Math.min(95, Math.round((own / (own + en)) * 100)));
        var s = document.createElement("span");
        s.className = "enh-rate";
        s.textContent = "（勝率目安 " + r + "%）";
        el.appendChild(s);
      }
    }

    /* ---------- 起動 & 監視 ---------- */
    function tick() {
      try { augment(); maybeTip(); } catch (e) {}
    }
    var mo;
    function start() {
      tick();
      try {
        mo = new MutationObserver(function () {
          if (mo._t) return;
          mo._t = setTimeout(function () { mo._t = 0; tick(); }, 250);
        });
        mo.observe(document.body, { childList: true, subtree: true });
      } catch (e) {}
      // 念のため定期チェックも（軽量）
      setInterval(tick, 1500);
    }
    if (document.body) start();
    else window.addEventListener("DOMContentLoaded", start);
  } catch (e) {
    /* 拡張が失敗してもゲーム本体には影響させない */
  }
})();

/* ===== ホーム画面追加ガイド（ブラウザで開いた時だけ／アプリ起動時は出さない） ===== */
(function () {
  "use strict";
  try {
    var LS = (function () { try { return window.localStorage; } catch (e) { return null; } })();
    var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    if (standalone) return; // ホーム画面アプリとして起動中→出さない
    try { if (LS && LS.getItem("enh_home_v1")) return; } catch (e) {}
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var howto = isIOS
      ? "Safariの共有ボタン（⬆️の四角）→「ホーム画面に追加」"
      : "ブラウザのメニュー →「ホーム画面に追加」/「アプリをインストール」";
    var st = document.createElement("style");
    st.textContent =
      ".enh-home{position:fixed;left:8px;right:8px;top:8px;z-index:10001;background:#1C2B45;color:#fff;border-radius:12px;padding:11px 13px;font-family:sans-serif;font-size:12px;line-height:1.55;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:560px;margin:0 auto}" +
      ".enh-home b{color:#FFD27D}" +
      ".enh-home .sub{opacity:.9;font-size:11px;display:block;margin-top:3px}" +
      ".enh-home button{margin-top:8px;background:#C73E2E;color:#fff;border:none;border-radius:8px;padding:5px 12px;font-size:11px;font-weight:700}";
    document.head.appendChild(st);
    function show() {
      try {
        if (document.querySelector(".enh-home")) return;
        var bar = document.createElement("div");
        bar.className = "enh-home";
        bar.innerHTML = '📲 <b>ホーム画面に追加</b>すると、アプリのように全画面で快適に遊べます。<span class="sub">' + howto + '</span><button>追加した・閉じる</button>';
        bar.querySelector("button").addEventListener("click", function () {
          bar.remove();
          try { LS && LS.setItem("enh_home_v1", "1"); } catch (e) {}
        });
        document.body.appendChild(bar);
      } catch (e) {}
    }
    if (document.body) show();
    else window.addEventListener("DOMContentLoaded", show);
  } catch (e) {}
})();
</script></body></html>
